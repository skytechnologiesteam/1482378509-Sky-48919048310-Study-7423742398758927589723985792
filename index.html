<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sky Study</title>
<style>
  :root{
    --sky-deep:#eaf6fd;
    --sky-mid:#4fb8e8;
    --sky-bright:#7fd0f5;
    --sky-pale:#16222c;
    --cloud:#141b22;
    --panel:#111820;
    --ink:#e9f2f7;
    --ink-soft:#8fa4b3;
    --line:#233240;
    --danger:#e0776a;
    --radius:14px;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{overscroll-behavior:none;}
  body{
    margin:0;
    min-height:100vh;
    min-height:100dvh;
    background:
      radial-gradient(ellipse at 20% -10%, #14232f 0%, transparent 55%),
      radial-gradient(ellipse at 90% 0%, #10202c 0%, transparent 45%),
      linear-gradient(180deg,#0b1218 0%, #0d151c 40%, #0a1016 100%);
    color:var(--ink);
    -webkit-text-size-adjust:100%;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px clamp(14px,4vw,48px);
    gap:14px;
    flex-wrap:wrap;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:38px;height:38px;
    border-radius:12px;
    background:linear-gradient(135deg,var(--sky-bright),var(--sky-mid));
    position:relative;
    box-shadow:0 6px 16px rgba(79,184,232,.25);
    flex-shrink:0;
  }
  .brand-mark::before{
    content:"";
    position:absolute;
    left:9px;top:15px;
    width:20px;height:8px;
    background:#0b1218;
    border-radius:99px;
  }
  .brand-mark::after{
    content:"";
    position:absolute;
    left:14px;top:9px;
    width:11px;height:11px;
    background:#0b1218;
    border-radius:50%;
  }
  .brand-text .name{
    font-size:19px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:var(--sky-deep);
    line-height:1.1;
  }
  .brand-text .tag{
    font-size:12px;
    color:var(--ink-soft);
  }

  .search-wrap{
    position:relative;
    flex:1 1 260px;
    max-width:480px;
  }
  .search-wrap input{
    width:100%;
    padding:12px 16px 12px 40px;
    border-radius:99px;
    border:1.5px solid var(--line);
    background:var(--panel);
    font-size:16px; /* 16px avoids iOS auto-zoom on focus */
    color:var(--ink);
    outline:none;
    transition:border-color .15s, box-shadow .15s;
  }
  .search-wrap input::placeholder{color:var(--ink-soft);}
  .search-wrap input:focus{
    border-color:var(--sky-bright);
    box-shadow:0 0 0 4px rgba(79,184,232,.15);
  }
  .search-wrap svg{
    position:absolute;
    left:14px;top:50%;
    transform:translateY(-50%);
    width:16px;height:16px;
    stroke:var(--ink-soft);
  }

  /* ---------- Layout ---------- */
  main{
    display:grid;
    grid-template-columns:minmax(0,1.15fr) minmax(280px,0.85fr);
    gap:20px;
    padding:0 clamp(14px,4vw,48px) 40px;
    align-items:start;
  }
  @media (max-width:880px){
    main{grid-template-columns:1fr; gap:16px; padding-left:12px; padding-right:12px;}
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    box-shadow:0 10px 30px rgba(0,0,0,.35);
  }

  /* ---------- Player ---------- */
  .player-panel{padding:0; overflow:hidden;}
  .player-stage{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    background:linear-gradient(160deg,#050c13,#0a1620 60%,#0d1f2c);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    cursor:pointer;
    user-select:none;
    touch-action:manipulation;
  }
  .player-stage video{
    width:100%;height:100%;
    object-fit:contain;
    background:#020608;
    display:block;
    pointer-events:none; /* clicks handled by stage wrapper */
  }
  .empty-stage{
    text-align:center;
    color:#7fa6bd;
    padding:24px;
    cursor:default;
  }
  .empty-stage svg{width:40px;height:40px;stroke:#4f7a92;margin-bottom:10px;}
  .empty-stage p{margin:0;font-size:14px;color:#617f90;}
  .empty-stage strong{display:block;color:#cfe8f5;font-size:16px;margin-bottom:4px;}

  /* audio-only backdrop */
  .audio-stage{
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    color:#cfe8f5;
    pointer-events:none;
    padding:20px;
  }
  .audio-stage .audio-orb{
    width:84px;height:84px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #2a4a5c, #0d1f2c 70%);
    border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 8px rgba(79,184,232,.05);
    flex-shrink:0;
  }
  .audio-stage .audio-orb svg{width:32px;height:32px;stroke:var(--sky-bright);}
  .audio-stage .audio-title{
    font-size:14px;
    font-weight:600;
    color:#dff2fb;
    max-width:80%;
    text-align:center;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  /* center play/pause glyph shown briefly on click */
  .center-glyph{
    position:absolute;
    width:64px;height:64px;
    border-radius:50%;
    background:rgba(10,20,28,.55);
    backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;
    color:#fff;
    opacity:0;
    pointer-events:none;
    transition:opacity .18s ease, transform .18s ease;
    transform:scale(.85);
    z-index:6;
  }
  .center-glyph.show{opacity:1; transform:scale(1);}
  .center-glyph svg{width:28px;height:28px;}

  /* watermark */
  .watermark{
    position:absolute;
    bottom:12px;
    right:14px;
    display:flex;
    align-items:center;
    gap:6px;
    padding:5px 10px 5px 6px;
    background:rgba(6,14,20,.55);
    backdrop-filter:blur(3px);
    border-radius:99px;
    color:#eaf8ff;
    font-size:11.5px;
    font-weight:600;
    letter-spacing:.01em;
    pointer-events:none;
    z-index:5;
    opacity:.9;
  }
  .watermark .wm-dot{
    width:16px;height:16px;
    border-radius:6px;
    background:linear-gradient(135deg,var(--sky-bright),var(--sky-mid));
    position:relative;
    flex-shrink:0;
  }
  .watermark .wm-dot::before{
    content:"";
    position:absolute;left:3px;top:6px;width:10px;height:4px;
    background:#0b1218;border-radius:99px;
  }

  audio.native-fallback{display:none;}

  /* status banner (e.g. playback errors) */
  .stage-status{
    position:absolute;
    top:12px;left:12px;right:12px;
    z-index:6;
    background:rgba(224,119,106,.14);
    border:1px solid rgba(224,119,106,.4);
    color:#ffd9d2;
    font-size:12.5px;
    padding:8px 12px;
    border-radius:9px;
    display:none;
    pointer-events:none;
  }
  .stage-status.show{display:block;}

  /* custom controls */
  .controls{
    padding:12px 16px 16px;
    background:var(--panel);
  }
  .now-playing{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
    margin-bottom:10px;
  }
  .now-playing .title{
    font-size:14.5px;
    font-weight:600;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .now-playing .kind{
    font-size:11.5px;
    color:var(--sky-bright);
    background:var(--sky-pale);
    padding:3px 9px;
    border-radius:99px;
    flex-shrink:0;
    font-weight:600;
  }

  .seek-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .time{
    font-size:12px;
    color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    width:42px;
    flex-shrink:0;
  }
  .time.end{text-align:right;}

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    height:6px;
    border-radius:99px;
    background:var(--line);
    outline:none;
    flex:1;
    cursor:pointer;
    touch-action:manipulation;
  }
  input[type="range"]#seek, .fs-controls input[type="range"].fs-seek{
    background:linear-gradient(90deg,var(--sky-mid) var(--progress,0%), var(--line) var(--progress,0%));
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;height:16px;
    border-radius:50%;
    background:var(--sky-bright);
    border:2px solid #0b1218;
    box-shadow:0 1px 4px rgba(0,0,0,.5);
    cursor:pointer;
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;
    border-radius:50%;
    background:var(--sky-bright);
    border:2px solid #0b1218;
    cursor:pointer;
  }

  .btn-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    flex-wrap:wrap;
  }
  .btn-row .left, .btn-row .right{
    display:flex;align-items:center;gap:8px;
  }
  .ctrl-btn{
    width:38px;height:38px;
    border-radius:10px;
    border:none;
    background:var(--sky-pale);
    color:var(--sky-bright);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s, transform .1s;
    flex-shrink:0;
    touch-action:manipulation;
  }
  .ctrl-btn:hover{background:#1d2e3b;}
  .ctrl-btn:active{transform:scale(.94);}
  .ctrl-btn.play{
    width:44px;height:44px;
    background:linear-gradient(135deg,var(--sky-bright),var(--sky-mid));
    color:#0b1218;
  }
  .ctrl-btn.play:hover{filter:brightness(1.08);}
  .ctrl-btn svg{width:17px;height:17px;}
  .ctrl-btn.play svg{width:19px;height:19px;}

  .vol-wrap{display:flex;align-items:center;gap:6px;}
  .vol-wrap input[type="range"]{width:70px;}

  select.speed-select{
    border:1.5px solid var(--line);
    border-radius:8px;
    background:var(--sky-pale);
    color:var(--ink);
    font-size:12.5px;
    padding:6px 8px;
    cursor:pointer;
  }

  @media (max-width:480px){
    .ctrl-btn{width:42px;height:42px;}
    .ctrl-btn.play{width:50px;height:50px;}
    .vol-wrap{display:none;} /* saves space on small phones; volume via hardware buttons */
    .btn-row{gap:10px;}
  }

  /* ---------- Fullscreen (custom, no native browser controls) ---------- */
  .player-stage.fs-active{
    position:fixed;
    inset:0;
    z-index:1000;
    width:100vw;
    height:100vh;
    height:100dvh;
    aspect-ratio:auto;
    border-radius:0;
  }
  body.fs-open{overflow:hidden;}

  .fs-controls{
    display:none;
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:1001;
    padding:10px clamp(12px,3vw,32px) calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(4,10,15,.9), rgba(4,10,15,.55) 70%, rgba(4,10,15,0));
    pointer-events:auto;
  }
  body.fs-open .fs-controls{display:block;}

  .fs-controls .now-playing .title{color:#eaf6fd;}
  .fs-controls .now-playing .kind{background:rgba(255,255,255,.1); color:#bfe6f7;}
  .fs-controls .time{color:#cfe3ee;}
  .fs-controls .ctrl-btn{background:rgba(255,255,255,.12); color:#eaf6fd;}
  .fs-controls .ctrl-btn:hover{background:rgba(255,255,255,.2);}
  .fs-controls .ctrl-btn.play{background:linear-gradient(135deg,var(--sky-bright),var(--sky-mid)); color:#0b1218;}
  .fs-controls select.speed-select{background:rgba(255,255,255,.12); color:#eaf6fd; border-color:rgba(255,255,255,.2);}

  .fs-exit-btn{
    position:fixed;
    top:calc(14px + env(safe-area-inset-top));
    right:14px;
    z-index:1002;
    width:40px;height:40px;
    border-radius:10px;
    border:none;
    background:rgba(10,20,28,.6);
    color:#eaf8ff;
    display:none;
    align-items:center;justify-content:center;
    cursor:pointer;
    touch-action:manipulation;
  }
  body.fs-open .fs-exit-btn{display:flex;}

  /* ---------- Library ---------- */
  .library-panel{padding:16px 16px 18px; max-height:82vh; display:flex; flex-direction:column;}
  @media (max-width:880px){
    .library-panel{max-height:52vh;}
  }
  .library-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
  }
  .library-head h2{
    font-size:15px;
    margin:0;
    color:var(--sky-deep);
  }
  .count-pill{
    font-size:11.5px;
    color:var(--ink-soft);
    background:var(--sky-pale);
    padding:3px 10px;
    border-radius:99px;
    font-weight:600;
  }

  .status-line{
    font-size:12px;
    color:var(--ink-soft);
    margin-top:10px;
    min-height:16px;
  }
  .status-line.error{color:var(--danger);}
  .status-line.success{color:#5fc98a;}

  .track-list{
    list-style:none;
    margin:0;padding:0;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    flex:1;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .track-list::-webkit-scrollbar{width:6px;}
  .track-list::-webkit-scrollbar-thumb{background:var(--line); border-radius:99px;}

  .track-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 10px;
    border-radius:10px;
    cursor:pointer;
    border:1px solid transparent;
    transition:background .15s, border-color .15s;
    touch-action:manipulation;
  }
  .track-item:hover{background:var(--sky-pale);}
  .track-item.active{
    background:var(--sky-pale);
    border-color:var(--sky-mid);
  }
  .track-icon{
    width:34px;height:34px;
    border-radius:9px;
    background:linear-gradient(135deg,#1a2b36,#132029);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    color:var(--sky-bright);
  }
  .track-icon svg{width:16px;height:16px;}
  .track-meta{min-width:0; flex:1;}
  .track-name{
    font-size:13.5px;
    font-weight:600;
    color:var(--ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .track-type{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .empty-list{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:30px 10px;
  }

  footer{
    text-align:center;
    padding:10px 16px 30px;
    font-size:12px;
    color:var(--ink-soft);
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-text">
      <div class="name">Sky Study</div>
      <div class="tag">Your lecture library, in one clear sky</div>
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input id="searchInput" type="text" placeholder="Search your videos and audio…" autocomplete="off">
  </div>
</header>

<button class="fs-exit-btn" id="fsExitBtn" title="Exit fullscreen">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3m10-5h3v3a2 2 0 0 1-2 2h-3"></path></svg>
</button>

<main>
  <!-- PLAYER -->
  <section class="panel player-panel">
    <div class="player-stage" id="playerStage" oncontextmenu="return false;">
      <div class="empty-stage" id="emptyStage">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path><polygon points="10 8 16 12 10 16 10 8"></polygon></svg>
        <strong>Nothing playing</strong>
        <p>Pick something from the list to begin.</p>
      </div>
      <video id="videoEl" playsinline webkit-playsinline disablePictureInPicture controlsList="nodownload noremoteplayback noplaybackrate" style="display:none;"></video>
      <div class="audio-stage" id="audioStage">
        <div class="audio-orb">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
        </div>
        <div class="audio-title" id="audioStageTitle">—</div>
      </div>
      <div class="center-glyph" id="centerGlyph">
        <svg id="centerIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
      </div>
      <div class="stage-status" id="stageStatus"></div>
      <div class="watermark" id="watermark" style="display:none;">
        <span class="wm-dot"></span> Sky Study
      </div>
    </div>
    <audio id="audioEl" class="native-fallback" controlsList="nodownload noremoteplayback" oncontextmenu="return false;" preload="metadata"></audio>

    <div class="controls" id="controls" style="display:none;">
      <div class="now-playing">
        <div class="title" id="nowTitle">—</div>
        <div class="kind" id="nowKind">VIDEO</div>
      </div>
      <div class="seek-row">
        <span class="time" id="timeCurrent">0:00</span>
        <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
        <span class="time end" id="timeDuration">0:00</span>
      </div>
      <div class="btn-row">
        <div class="left">
          <button class="ctrl-btn" id="rewindBtn" title="Back 10s">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg>
          </button>
          <button class="ctrl-btn play" id="playBtn" title="Play/Pause (Space)">
            <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg>
          </button>
          <button class="ctrl-btn" id="forwardBtn" title="Forward 10s">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
          </button>
        </div>
        <div class="right">
          <select class="speed-select" id="speed" title="Playback speed">
            <option value="0.75">0.75x</option>
            <option value="1" selected>1x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="2">2x</option>
          </select>
          <div class="vol-wrap">
            <button class="ctrl-btn" id="muteBtn" title="Mute">
              <svg id="volIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
            </button>
            <input type="range" id="volume" min="0" max="1" step="0.01" value="1">
          </div>
          <button class="ctrl-btn" id="fullscreenBtn" title="Fullscreen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Fullscreen control bar: a live clone of .controls is moved here while in fullscreen -->
    <div class="fs-controls" id="fsControls"></div>
  </section>

  <!-- LIBRARY -->
  <section class="panel library-panel">
    <div class="library-head">
      <h2>Library</h2>
      <span class="count-pill" id="countPill"></span>
    </div>

    <ul class="track-list" id="trackList"></ul>
  </section>
</main>

<script data-repo="skytechnologiesteam/1482378509-Sky-48919048310-Study-7423742398758927589723985792" data-branch="main">
(function(){
  "use strict";

  const thisScript = document.currentScript;

  // ---------- State ----------
  let allFiles = [];
  let filteredFiles = [];
  let currentIndex = -1;
  let glyphTimer = null;
  let currentFile = null;
  let triedFallbackUrl = false;

  const el = (id) => document.getElementById(id);

  const trackList = el('trackList');
  const countPill = el('countPill');
  const searchInput = el('searchInput');

  const playerStage = el('playerStage');
  const emptyStage = el('emptyStage');
  const videoEl = el('videoEl');
  const audioEl = el('audioEl');
  const audioStage = el('audioStage');
  const audioStageTitle = el('audioStageTitle');
  const watermark = el('watermark');
  const centerGlyph = el('centerGlyph');
  const centerIcon = el('centerIcon');
  const stageStatus = el('stageStatus');
  const controls = el('controls');
  const fsControls = el('fsControls');
  const controlsHome = controls.parentElement; // where .controls normally lives
  const nowTitle = el('nowTitle');
  const nowKind = el('nowKind');

  const fsExitBtn = el('fsExitBtn');

  const PLAY_SVG = '<polygon points="6 3 20 12 6 21 6 3"></polygon>';
  const PAUSE_SVG = '<rect x="5" y="3" width="5" height="18" rx="1"></rect><rect x="14" y="3" width="5" height="18" rx="1"></rect>';

  // ---------- Helpers ----------
  function cleanName(filename){
    const dot = filename.lastIndexOf('.');
    const base = dot > -1 ? filename.slice(0, dot) : filename;
    return base.replace(/_/g, ' ').trim();
  }

  function extOf(filename){
    const dot = filename.lastIndexOf('.');
    return dot > -1 ? filename.slice(dot+1).toLowerCase() : '';
  }

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60);
    const s = Math.floor(sec%60);
    return m + ':' + String(s).padStart(2,'0');
  }

  function showStatus(msg){
    stageStatus.textContent = msg;
    stageStatus.classList.add('show');
  }
  function hideStatus(){
    stageStatus.classList.remove('show');
  }

  // ---------- Auto-scan this repository ----------
  function detectRepo(){
    const host = location.hostname;
    const parts = location.pathname.split('/').filter(Boolean);

    if(host.endsWith('.github.io')){
      return {
        owner: host.split('.')[0],
        repo: parts[0] || (host.split('.')[0] + '.github.io'),
        branch: 'main'
      };
    }

    if(thisScript && thisScript.dataset && thisScript.dataset.repo){
      const [owner, repo] = thisScript.dataset.repo.split('/');
      if(owner && repo) return { owner, repo, branch: thisScript.dataset.branch || 'main' };
    }
    return null;
  }

  let repoInfo = null;

  function toPlaybackUrl(owner, repo, branch, path){
    return 'https://cdn.jsdelivr.net/gh/' + owner + '/' + repo + '@' + branch + '/' +
      path.split('/').map(encodeURIComponent).join('/');
  }
  function toRawUrl(owner, repo, branch, path){
    return 'https://raw.githubusercontent.com/' + owner + '/' + repo + '/' + branch + '/' +
      path.split('/').map(encodeURIComponent).join('/');
  }

  const AUDIO_EXTS = ['m4a', 'mp3', 'aac', 'wav', 'ogg', 'oga', 'flac'];
  const VIDEO_EXTS = ['mp4', 'mov', 'm4v', 'webm'];

  async function loadLibrary(){
    const repo = detectRepo();
    if(!repo || !repo.owner || !repo.repo) return;
    repoInfo = repo;

    try{
      const apiUrl = 'https://api.github.com/repos/' + repo.owner + '/' + repo.repo +
        '/git/trees/' + repo.branch + '?recursive=1';
      const res = await fetch(apiUrl);
      if(!res.ok) return;
      const data = await res.json();
      if(!Array.isArray(data.tree)) return;

      allFiles = data.tree
        .filter(item => {
          if(item.type !== 'blob') return false;
          const ext = extOf(item.path);
          return AUDIO_EXTS.includes(ext) || VIDEO_EXTS.includes(ext);
        })
        .map(item => {
          const name = item.path.split('/').pop();
          const ext = extOf(name);
          return {
            name,
            path: item.path,
            displayName: cleanName(name),
            type: VIDEO_EXTS.includes(ext) ? 'video' : 'audio',
            ext,
            url: toPlaybackUrl(repo.owner, repo.repo, repo.branch, item.path)
          };
        })
        .sort((a,b) => a.displayName.localeCompare(b.displayName));

      applyFilter();
    }catch(err){
      // Quietly leave the library empty rather than surfacing technical errors.
    }
  }
  loadLibrary();
  window.addEventListener('focus', loadLibrary);

  // ---------- Search ----------
  function applyFilter(){
    const q = searchInput.value.trim().toLowerCase();
    filteredFiles = q ? allFiles.filter(f => f.displayName.toLowerCase().includes(q)) : allFiles.slice();
    renderList();
  }
  searchInput.addEventListener('input', applyFilter);

  function renderList(){
    trackList.innerHTML = '';
    countPill.textContent = allFiles.length ? (allFiles.length + ' file' + (allFiles.length===1?'':'s')) : '';

    if(filteredFiles.length === 0){
      const li = document.createElement('li');
      li.className = 'empty-list';
      li.textContent = allFiles.length === 0
        ? 'Nothing here yet.'
        : 'No matches.';
      trackList.appendChild(li);
      return;
    }

    filteredFiles.forEach((file) => {
      const li = document.createElement('li');
      li.className = 'track-item' + (currentIndex > -1 && allFiles[currentIndex] === file ? ' active' : '');
      li.innerHTML =
        '<div class="track-icon">' + (file.type === 'video' ? videoIconSvg() : audioIconSvg()) + '</div>' +
        '<div class="track-meta">' +
          '<div class="track-name">' + escapeHtml(file.displayName) + '</div>' +
          '<div class="track-type">' + file.type + '</div>' +
        '</div>';
      li.addEventListener('click', () => playFile(file));
      trackList.appendChild(li);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function videoIconSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="15" height="14" rx="2"></rect><polygon points="22 8 17 12 22 16 22 8"></polygon></svg>';
  }
  function audioIconSvg(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>';
  }

  // ---------- Player ----------
  function activeMediaEl(){
    return videoEl.style.display !== 'none' ? videoEl : audioEl;
  }

  function playFile(file){
    currentIndex = allFiles.indexOf(file);
    currentFile = file;
    triedFallbackUrl = false;
    hideStatus();
    emptyStage.style.display = 'none';
    controls.style.display = 'block';
    nowTitle.textContent = file.displayName;
    nowKind.textContent = file.type.toUpperCase();

    videoEl.pause();
    audioEl.pause();

    if(file.type === 'video'){
      videoEl.style.display = 'block';
      audioStage.style.display = 'none';
      watermark.style.display = 'flex';
      loadMedia(videoEl, file);
    }else{
      videoEl.style.display = 'none';
      watermark.style.display = 'flex';
      audioStage.style.display = 'flex';
      audioStageTitle.textContent = file.displayName;
      loadMedia(audioEl, file);
    }
    bindMediaEvents();
    renderList();
  }

  // Directly assign .src rather than a typed <source> element: forcing a
  // MIME type that doesn't exactly match the file's actual codec (common
  // with .m4a, which can be AAC in an MP4 container encoded a few
  // different ways) makes some browsers refuse to play it at all. Letting
  // the browser sniff the content itself is more forgiving. If it still
  // fails (e.g. a flaky CDN response), we retry once against GitHub's raw
  // file host as a fallback source.
  function loadMedia(mediaEl, file){
    mediaEl.removeAttribute('src');
    while(mediaEl.firstChild) mediaEl.removeChild(mediaEl.firstChild);
    mediaEl.src = file.url;
    mediaEl.load();
    const p = mediaEl.play();
    if(p && p.catch){
      p.catch((err) => {
        // Autoplay block vs real decode error both land here; a decode/
        // network error will also fire the element's 'error' event, which
        // triggerRetryOrError() below handles with the raw-host fallback.
        if(err && err.name === 'NotAllowedError'){
          showStatus('Tap play to start — your browser blocked autoplay.');
        }
      });
    }
  }

  function triggerRetryOrError(mediaEl){
    if(!currentFile || !repoInfo){
      showStatus('This file could not be played.');
      return;
    }
    if(!triedFallbackUrl){
      triedFallbackUrl = true;
      const rawUrl = toRawUrl(repoInfo.owner, repoInfo.repo, repoInfo.branch, currentFile.path);
      mediaEl.removeAttribute('src');
      mediaEl.src = rawUrl;
      mediaEl.load();
      mediaEl.play().catch(() => {
        showStatus('This file could not be played on this device.');
      });
    }else{
      showStatus('This file could not be played on this device.');
    }
  }

  function bindMediaEvents(){
    const m = activeMediaEl();
    const speedSel = document.getElementById('speed');
    const volume = document.getElementById('volume');
    m.playbackRate = parseFloat(speedSel.value);
    m.volume = parseFloat(volume.value);
    updatePlayIcon(!m.paused);
  }

  function updatePlayIcon(isPlaying){
    document.querySelectorAll('.playIconTarget').forEach(icon => icon.innerHTML = isPlaying ? PAUSE_SVG : PLAY_SVG);
  }

  function hasLoadableMedia(m){
    return !!(m && m.getAttribute && m.getAttribute('src'));
  }

  function togglePlay(){
    const m = activeMediaEl();
    if(!hasLoadableMedia(m)) return;
    if(m.paused){ m.play().catch(()=>{}); } else { m.pause(); }
  }

  function flashCenterGlyph(showPlaySymbol){
    centerIcon.innerHTML = showPlaySymbol ? PLAY_SVG : PAUSE_SVG;
    centerGlyph.classList.remove('show');
    void centerGlyph.offsetWidth;
    centerGlyph.classList.add('show');
    clearTimeout(glyphTimer);
    glyphTimer = setTimeout(() => centerGlyph.classList.remove('show'), 420);
  }

  // Click anywhere on the player stage toggles play/pause (ignored while
  // nothing is loaded, and control-bar clicks are stopped separately).
  playerStage.addEventListener('click', () => {
    if(currentIndex === -1) return;
    togglePlay();
  });

  // Spacebar toggles play/pause, unless the user is typing in a text field
  // or has focus on a form control that itself uses Space (select, etc).
  document.addEventListener('keydown', (e) => {
    if(e.code !== 'Space' && e.key !== ' ') return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if(['INPUT','TEXTAREA','SELECT','BUTTON'].includes(tag)) return;
    if(currentIndex === -1) return;
    e.preventDefault();
    togglePlay();
  });

  // ---------- Media element wiring (shared by both video and audio) ----------
  [videoEl, audioEl].forEach(m => {
    m.addEventListener('play', () => { if(activeMediaEl() === m){ updatePlayIcon(true); } });
    m.addEventListener('pause', () => { if(activeMediaEl() === m){ updatePlayIcon(false); } });
    m.addEventListener('playing', hideStatus);
    m.addEventListener('error', () => { if(activeMediaEl() === m) triggerRetryOrError(m); });
    m.addEventListener('timeupdate', () => {
      if(activeMediaEl() !== m) return;
      document.querySelectorAll('.seekInput').forEach(seekInput => {
        const pct = m.duration ? (m.currentTime / m.duration) * 100 : 0;
        seekInput.value = pct;
        seekInput.style.setProperty('--progress', pct + '%');
      });
      document.querySelectorAll('.timeCurrentTarget').forEach(t => t.textContent = fmtTime(m.currentTime));
      document.querySelectorAll('.timeDurationTarget').forEach(t => t.textContent = fmtTime(m.duration));
    });
    m.addEventListener('ended', () => updatePlayIcon(false));
    m.addEventListener('loadedmetadata', () => {
      if(activeMediaEl() === m){
        document.querySelectorAll('.timeDurationTarget').forEach(t => t.textContent = fmtTime(m.duration));
      }
    });
  });

  // ---------- Control-bar behavior (delegated so it works for both the
  // inline controls and the cloned fullscreen controls) ----------
  function wireControlsScope(scope){
    scope.addEventListener('click', (e) => e.stopPropagation());

    const playBtn = scope.querySelector('#playBtn') || scope.querySelector('.playBtnClone');
    if(playBtn) playBtn.addEventListener('click', togglePlay);

    const rewindBtn = scope.querySelector('#rewindBtn') || scope.querySelector('.rewindBtnClone');
    if(rewindBtn) rewindBtn.addEventListener('click', () => { const m = activeMediaEl(); m.currentTime = Math.max(0, m.currentTime - 10); });

    const forwardBtn = scope.querySelector('#forwardBtn') || scope.querySelector('.forwardBtnClone');
    if(forwardBtn) forwardBtn.addEventListener('click', () => { const m = activeMediaEl(); m.currentTime = Math.min(m.duration||0, m.currentTime + 10); });

    const speedSel = scope.querySelector('select.speed-select');
    if(speedSel) speedSel.addEventListener('change', () => { videoEl.playbackRate = audioEl.playbackRate = parseFloat(speedSel.value); });

    const volumeInput = scope.querySelector('#volume');
    if(volumeInput) volumeInput.addEventListener('input', () => {
      const v = parseFloat(volumeInput.value);
      videoEl.volume = audioEl.volume = v;
      updateVolIcon(v);
    });

    const muteBtn = scope.querySelector('#muteBtn');
    if(muteBtn) muteBtn.addEventListener('click', () => {
      const m = activeMediaEl();
      m.muted = !m.muted;
      updateVolIcon(m.muted ? 0 : m.volume);
    });

    const fullscreenBtn = scope.querySelector('#fullscreenBtn');
    if(fullscreenBtn) fullscreenBtn.addEventListener('click', enterFullscreen);

    const seekInput = scope.querySelector('#seek');
    if(seekInput) seekInput.addEventListener('input', () => {
      const m = activeMediaEl();
      if(!m.duration) return;
      m.currentTime = (parseFloat(seekInput.value) / 100) * m.duration;
    });
  }

  function updateVolIcon(v){
    document.querySelectorAll('#volIcon').forEach(volIcon => {
      volIcon.innerHTML = v === 0
        ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>'
        : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>';
    });
  }

  // Tag elements inside the main controls bar so the shared update
  // functions above (which query by class) can find them consistently.
  document.getElementById('seek').classList.add('seekInput');
  document.getElementById('timeCurrent').classList.add('timeCurrentTarget');
  document.getElementById('timeDuration').classList.add('timeDurationTarget');
  document.getElementById('playIcon').classList.add('playIconTarget');

  wireControlsScope(controls);

  // ---------- Custom fullscreen ----------
  // Rather than the browser's native fullscreen (which shows its own
  // control bar with a download option on some platforms), we expand the
  // player stage to fill the viewport ourselves and move a lightweight
  // control bar into it.
  function buildFsControls(){
    fsControls.innerHTML =
      '<div class="now-playing">' +
        '<div class="title">' + escapeHtml(currentFile ? currentFile.displayName : '') + '</div>' +
        '<div class="kind">' + (currentFile ? currentFile.type.toUpperCase() : '') + '</div>' +
      '</div>' +
      '<div class="seek-row">' +
        '<span class="time timeCurrentTarget">0:00</span>' +
        '<input type="range" class="seekInput" id="fsSeek" min="0" max="100" value="0" step="0.1">' +
        '<span class="time end timeDurationTarget">0:00</span>' +
      '</div>' +
      '<div class="btn-row">' +
        '<div class="left">' +
          '<button class="ctrl-btn rewindBtnClone" title="Back 10s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path></svg></button>' +
          '<button class="ctrl-btn play playBtnClone" title="Play/Pause (Space)"><svg class="playIconTarget" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></button>' +
          '<button class="ctrl-btn forwardBtnClone" title="Forward 10s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg></button>' +
        '</div>' +
        '<div class="right">' +
          '<select class="speed-select" title="Playback speed">' +
            '<option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option>' +
          '</select>' +
        '</div>' +
      '</div>';
    fsControls.querySelector('.speed-select').value = document.getElementById('speed').value;
    wireControlsScope(fsControls);
    updatePlayIcon(!activeMediaEl().paused);
    const m = activeMediaEl();
    const pct = m.duration ? (m.currentTime / m.duration) * 100 : 0;
    const s = fsControls.querySelector('.seekInput');
    s.value = pct;
    s.style.setProperty('--progress', pct + '%');
    fsControls.querySelector('.timeCurrentTarget').textContent = fmtTime(m.currentTime);
    fsControls.querySelector('.timeDurationTarget').textContent = fmtTime(m.duration);
  }

  function enterFullscreen(){
    if(currentIndex === -1) return;
    buildFsControls();
    playerStage.classList.add('fs-active');
    document.body.classList.add('fs-open');
  }
  function exitFullscreen(){
    playerStage.classList.remove('fs-active');
    document.body.classList.remove('fs-open');
    fsControls.innerHTML = '';
  }
  fsExitBtn.addEventListener('click', exitFullscreen);
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && document.body.classList.contains('fs-open')) exitFullscreen();
  });

  // Init
  updateVolIcon(1);
})();
</script>
</body>
</html>
